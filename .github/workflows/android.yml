name: Build Android APK & Run Experiments

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Execute Experimental Kotlin Scripts
        run: |
          sudo apt-get update && sudo apt-get install -y kotlin
          kotlinc -script experiments/parameter_bench.kts
          kotlinc -script experiments/mesh_generator.kts

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Generated Mesh Artifact
        uses: actions/upload-artifact@v4
        with:
          name: experimental-mesh-obj
          path: superellipsoid_mesh.obj
          
